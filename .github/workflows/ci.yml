name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run tests
        run: pytest backend -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start the stack and check it answers
        run: |
          docker compose up -d --wait
          curl --fail --silent http://localhost:8090/api/health
          curl --fail --silent http://localhost:8090/ | grep -q "Uptime Board"
