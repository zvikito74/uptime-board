services:
  api:
    build: ./backend
    environment:
      CHECK_INTERVAL: "30"
      SEED_TARGETS: "GitHub|https://github.com,Wikipedia|https://www.wikipedia.org,Python|https://www.python.org"
    volumes:
      - uptime-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uptime-data:
