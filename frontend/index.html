<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap header-row">
      <h1>Uptime Board</h1>
      <div id="summary" class="summary">Loading…</div>
    </div>
  </header>

  <main class="wrap">
    <form id="add-form" class="add-form">
      <input name="name" placeholder="Name" maxlength="60" required>
      <input name="url" type="url" placeholder="https://example.com" required>
      <button type="submit">Add site</button>
      <button type="button" id="check-now" class="secondary">Check now</button>
      <span id="form-error" class="form-error"></span>
    </form>

    <div id="targets" class="targets"></div>
    <p id="empty" class="empty" hidden>No sites yet. Add one above.</p>
  </main>

  <footer class="wrap">Refreshes every 10 seconds · <span id="updated"></span></footer>

  <script src="app.js"></script>
</body>
</html>
